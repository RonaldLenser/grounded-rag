[project]
name = "grounded"
version = "0.1.0"
description = "RAG knowledge assistant that answers only from your documents, with verified citations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ron Lenser" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]  # "." makes evals/ first-party for import sorting

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # simplify
    "N",   # naming conventions
    "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # assert is how pytest works; fake test credentials are fine
"migrations/**" = ["N999"]     # Alembic revision filenames start with digits

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"  # `async def test_...` just works
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL + pgvector database (DATABASE_URL)",
]
